# Render.yaml - Infrastructure as Code for Render
# This file defines both frontend and backend services for deployment

services:
  # Backend Service (Node.js/Express API)
  - type: web
    name: drone-club-backend
    runtime: node
    plan: free  # Change to 'starter' or higher for production
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render will generate a secure value
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://drone-club-frontend.onrender.com  # Update with actual URL
      - key: PORT
        value: 5000
      - key: DB_NAME
        value: team-third-axis-db
      - key: ADMIN_EMAIL
        value: teamthirdaxis@gcoej.ac.in
      - key: ADMIN_PASSWORD
        sync: false  # Set manually in Render dashboard
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100

  # Frontend Service (React/Vite Static Site)
  - type: web
    name: drone-club-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false  # Set to true if needed
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html  # SPA routing support
    envVars:
      - key: VITE_API_URL
        value: https://drone-club-backend.onrender.com  # Update with actual backend URL
      - key: VITE_APP_TITLE
        value: Team Third Axis - Drone Club
      - key: VITE_NODE_ENV
        value: production
      - key: VITE_ENABLE_DEBUG_MODE
        value: false

# Optional: Database (if using Render PostgreSQL)
# databases:
